<header><h1>💗 TWICE Merch Picker</h1><p>TWICE THE THRILL · 只选商品，不付款、不填地址</p></header>
<main>
  <div class="toolbar">
    <div class="tools">
      <input class="search" id="search" placeholder="搜索商品，例如 keyring / T-shirt" oninput="renderProducts()">
      <label class="rate">₩1,000 ≈ RM <input id="rate" type="number" value="3.00" min="0" step="0.01" oninput="rateChanged()"></label>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="countline" id="countline"></div>
  <div class="grid" id="grid"></div>
  <section class="summary" id="summary">
    <h2>🛒 我的选择</h2>
    <div id="cart"></div>
    <div class="totalbox"><div><small>合计</small><div id="itemCount">0 件</div></div><div class="total" id="total">₩0<br><span style="font-size:14px;color:#b2387c">≈ RM 0.00</span></div></div>
    <div class="actions"><button class="action primary" onclick="copyOrder()">📋 复制清单</button><button class="action secondary" onclick="shareOrder()">↗️ 分享清单</button><button class="action clear" onclick="resetOrder()">清空全部</button></div>
  </section>
  <p class="footnote">商品名称、韩元价格和图片取自 JYP FANS 的 TWICE THE THRILL 官方商品页。RM 只按页面上方汇率估算，不含运费。Secret / Trading Card 等标注“随机”的商品无法指定成员。</p>
</main>

const filters=[['ALL','全部'],['TDOONGZ','TDOONGZ'],['PHOTO','PHOTO / GOODS'],['APPAREL','服装']];
let activeFilter='ALL';
let cart={};
let draftQty=Object.fromEntries(products.map(p=>[p.id,1]));
function safeLoad(){try{const s=localStorage.getItem('twiceThrillCartV2');if(s) cart=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem('twiceThrillCartV2',JSON.stringify(cart))}catch(e){}}
function krw(n){return '₩'+Number(n).toLocaleString('en-US')}
function getRate(){return Math.max(0,Number(document.getElementById('rate')?.value)||0)}
function rm(n){return 'RM '+(n/1000*getRate()).toFixed(2)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initFilters(){document.getElementById('filters').innerHTML=filters.map(([k,l])=>`<button class="chip ${activeFilter===k?'active':''}" onclick="setFilter('${k}')">${l}</button>`).join('')}
function setFilter(k){activeFilter=k;initFilters();renderProducts()}
function badgeText(p){if(p.type==='select') return p.id===17?'SIZE':(p.id===16?'MEMBER':'9 MEMBER');if(p.fixed?.includes('随机')) return 'RANDOM';return p.category==='APPAREL'?'ONE SIZE':'SET'}
function variantControl(p){if(p.type==='select'){return `<select id="variant-${p.id}"><option value="">请选择${p.id===17?'尺码':'成员 / 款式'}</option>${p.variants.map(v=>`<option value="${esc(v.value)}">${esc(v.label)}</option>`).join('')}</select>`}return `<div class="fixed-variant">${esc(p.fixed||'固定款')}</div>`}
function renderProducts(){const q=(document.getElementById('search').value||'').trim().toLowerCase();const list=products.filter(p=>(activeFilter==='ALL'||p.category===activeFilter)&&(!q||p.name.toLowerCase().includes(q)||String(p.note||'').toLowerCase().includes(q)));document.getElementById('countline').textContent=`显示 ${list.length} / ${products.length} 款商品`;document.getElementById('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="image-wrap" onclick="openImage('${p.id}')"><img src="${p.image}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.opacity=.25"><span class="badge">${badgeText(p)}</span></div><div class="content"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.note||'')}</div><div class="price"><span>${krw(p.krw)}</span><span class="rm">≈ ${rm(p.krw)}</span></div>${variantControl(p)}<div class="picker"><div class="qty"><button onclick="draftChange(${p.id},-1)">−</button><span id="dq-${p.id}">${draftQty[p.id]||1}</span><button onclick="draftChange(${p.id},1)">+</button></div><button class="add" onclick="addItem(${p.id})">加入选择</button></div></div></article>`).join(''):`<div class="empty">没有找到商品</div>`}
function draftChange(id,d){draftQty[id]=Math.min(99,Math.max(1,(draftQty[id]||1)+d));const el=document.getElementById('dq-'+id);if(el) el.textContent=draftQty[id]}
function addItem(id){const p=products.find(x=>x.id===id);let variant=p.fixed||'固定款';if(p.type==='select'){const s=document.getElementById('variant-'+id);variant=s?s.value:'';if(!variant){toast(p.id===17?'请选择尺码':'请选择成员 / 款式');return}}const key=id+'||'+variant;const q=draftQty[id]||1;if(cart[key]) cart[key].qty+=q;else cart[key]={productId:id,variant,qty:q};save();renderCart();toast('已加入选择')}
function cartEntries(){return Object.entries(cart).map(([key,v])=>{const p=products.find(x=>x.id===v.productId);return {key,...v,p}}).filter(x=>x.p)}
function changeCart(key,d){if(!cart[key]) return;cart[key].qty+=d;if(cart[key].qty<=0) delete cart[key];save();renderCart()}
function removeItem(key){delete cart[key];save();renderCart()}
function renderCart(){const entries=cartEntries();const el=document.getElementById('cart');if(!entries.length) el.innerHTML='<div class="cart-empty">还没有选择商品</div>';else el.innerHTML=entries.map(x=>`<div class="cart-row"><div><div class="cart-title">${esc(x.p.name)}</div><div class="cart-variant">${esc(x.variant)}</div><div class="cart-price">${krw(x.p.krw)} · ≈ ${rm(x.p.krw)} / 件</div></div><div class="cart-actions"><button class="mini" onclick="changeCart('${x.key.replace(/'/g,"\'")}',-1)">−</button><b>${x.qty}</b><button class="mini" onclick="changeCart('${x.key.replace(/'/g,"\'")}',1)">+</button><button class="remove" onclick="removeItem('${x.key.replace(/'/g,"\'")}')">✕</button></div></div>`).join('');const qty=entries.reduce((a,x)=>a+x.qty,0);const total=entries.reduce((a,x)=>a+x.p.krw*x.qty,0);document.getElementById('itemCount').textContent=qty+' 件';document.getElementById('total').innerHTML=`${krw(total)}<br><span style="font-size:14px;color:#b2387c">≈ ${rm(total)}</span>`;document.getElementById('floatCount').textContent=qty+' 件';document.getElementById('floating').classList.toggle('hidden',qty===0);renderProducts()}
function orderText(){const entries=cartEntries();if(!entries.length) return 'TWICE THE THRILL\n还没有选择商品';const total=entries.reduce((a,x)=>a+x.p.krw*x.qty,0);return ['💗 TWICE THE THRILL','',...entries.map((x,i)=>`${i+1}. ${x.p.name}\n   ${x.variant} × ${x.qty} · ${krw(x.p.krw*x.qty)} · ≈ ${rm(x.p.krw*x.qty)}`),'',`合计：${krw(total)} · ≈ ${rm(total)}`].join('\n')}
async function copyOrder(){const t=orderText();try{await navigator.clipboard.writeText(t);toast('清单已复制')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('清单已复制')}catch(_e){prompt('长按复制以下清单',t)}ta.remove()}}
function shareOrder(){const t=orderText();if(navigator.share) navigator.share({title:'TWICE Merch Picker',text:t}).catch(()=>{});else copyOrder()}
function resetOrder(){if(!cartEntries().length) return; if(confirm('确定清空全部选择吗？')){cart={};save();renderCart()}}
function rateChanged(){renderProducts();renderCartOnly()}
function renderCartOnly(){const entries=cartEntries();const qty=entries.reduce((a,x)=>a+x.qty,0),total=entries.reduce((a,x)=>a+x.p.krw*x.qty,0);if(entries.length) document.getElementById('cart').innerHTML=entries.map(x=>`<div class="cart-row"><div><div class="cart-title">${esc(x.p.name)}</div><div class="cart-variant">${esc(x.variant)}</div><div class="cart-price">${krw(x.p.krw)} · ≈ ${rm(x.p.krw)} / 件</div></div><div class="cart-actions"><button class="mini" onclick="changeCart('${x.key.replace(/'/g,"\'")}',-1)">−</button><b>${x.qty}</b><button class="mini" onclick="changeCart('${x.key.replace(/'/g,"\'")}',1)">+</button><button class="remove" onclick="removeItem('${x.key.replace(/'/g,"\'")}')">✕</button></div></div>`).join('');document.getElementById('itemCount').textContent=qty+' 件';document.getElementById('total').innerHTML=`${krw(total)}<br><span style="font-size:14px;color:#b2387c">≈ ${rm(total)}</span>`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1400)}
function openImage(id){const p=products.find(x=>x.id==id);document.getElementById('modalImg').src=p.image;document.getElementById('modal').classList.add('show')}
function closeModal(e){if(e) e.stopPropagation();document.getElementById('modal').classList.remove('show')}
safeLoad();initFilters();renderProducts();renderCart();
</script>
